name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tradingview-claude
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: tradingview-claude/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: |
          node --check server.js
          node --check paper.js
          node --check store.js
          node --check scripts/send-test-signal.js
          node --check scripts/smoke-test.js

      - name: Smoke test
        run: npm run smoke
