<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TradingView × Claude — Signal Desk</title>
  <style>
    :root {
      --bg: #0f1216;
      --panel: #171b22;
      --border: #262c36;
      --text: #e6e9ef;
      --muted: #8b94a3;
      --buy: #26a69a;
      --sell: #ef5350;
      --hold: #d4a72c;
      --accent: #6c8cff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text);
    }
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 24px; border-bottom: 1px solid var(--border);
      position: sticky; top: 0; background: var(--bg); z-index: 2;
    }
    header h1 { font-size: 17px; margin: 0; font-weight: 600; }
    header h1 span { color: var(--accent); }
    .status { font-size: 13px; color: var(--muted); }
    .status b { color: var(--text); font-weight: 600; }
    main { max-width: 900px; margin: 0 auto; padding: 24px; }
    .empty { color: var(--muted); text-align: center; padding: 64px 0; }
    .card {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 10px; padding: 16px 18px; margin-bottom: 14px;
    }
    .card-top { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
    .pill {
      font-size: 12px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .04em; padding: 3px 10px; border-radius: 999px;
    }
    .pill.buy { background: rgba(38,166,154,.15); color: var(--buy); }
    .pill.sell { background: rgba(239,83,80,.15); color: var(--sell); }
    .pill.hold, .pill.close, .pill.ignore { background: rgba(212,167,44,.15); color: var(--hold); }
    .pill.analyzing, .pill.no_api_key, .pill.error {
      background: rgba(139,148,163,.15); color: var(--muted);
    }
    .sym { font-weight: 600; font-size: 15px; }
    .time { margin-left: auto; color: var(--muted); font-size: 12px; }
    .conf { color: var(--muted); font-size: 13px; }
    .reasoning { color: var(--text); margin: 8px 0 12px; }
    .reasoning.muted { color: var(--muted); font-style: italic; }
    pre {
      background: #0b0e12; border: 1px solid var(--border); border-radius: 6px;
      padding: 10px 12px; margin: 0; overflow-x: auto; font-size: 12px;
      color: var(--muted);
    }
    .spinner {
      width: 12px; height: 12px; border: 2px solid var(--border);
      border-top-color: var(--accent); border-radius: 50%;
      display: inline-block; animation: spin .8s linear infinite; vertical-align: -1px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Portfolio panel */
    .portfolio { max-width: 900px; margin: 24px auto 0; padding: 0 24px; }
    .paper-note {
      font-size: 12px; color: var(--muted); background: rgba(108,140,255,.08);
      border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; margin-bottom: 14px;
    }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 14px; }
    .stat { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
    .stat .label { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
    .stat .value { font-size: 20px; font-weight: 600; margin-top: 2px; }
    .pos-fresh, .up { color: var(--buy); }
    .down { color: var(--sell); }
    table { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 8px; }
    th, td { text-align: right; padding: 6px 10px; border-bottom: 1px solid var(--border); }
    th:first-child, td:first-child { text-align: left; }
    th { color: var(--muted); font-weight: 500; font-size: 11px; text-transform: uppercase; }
    .section-title { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin: 6px 0; }
    .trade-badge {
      font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px;
      background: rgba(108,140,255,.15); color: var(--accent); margin-left: 4px;
    }
    .paper-note { display: flex; align-items: center; gap: 12px; }
    .paper-note span { flex: 1; }
    .btn-reset {
      font: inherit; font-size: 12px; font-weight: 600; cursor: pointer;
      color: var(--sell); background: rgba(239,83,80,.1);
      border: 1px solid rgba(239,83,80,.35); border-radius: 6px;
      padding: 5px 12px; white-space: nowrap; flex: none;
    }
    .btn-reset:hover { background: rgba(239,83,80,.2); }
    .btn-reset:disabled { opacity: .5; cursor: default; }
    @media (max-width: 640px) { .stats { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>
  <header>
    <h1>TradingView <span>×</span> Claude — Signal Desk</h1>
    <div class="status" id="status">connecting…</div>
  </header>
  <div class="portfolio" id="portfolio"></div>
  <main id="feed"><div class="empty">Loading…</div></main>

  <script>
    const esc = (s) => String(s).replace(/[&<>"]/g, (c) =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const money = (n) => (n < 0 ? '-$' : '$') + Math.abs(n).toLocaleString(undefined, { maximumFractionDigits: 2 });
    const pnlClass = (n) => (n > 0 ? 'up' : n < 0 ? 'down' : '');
    const signed = (n) => (n >= 0 ? '+' : '') + money(n);

    function renderPortfolio(p) {
      const el = document.getElementById('portfolio');
      if (!p || !p.enabled) { el.innerHTML = ''; return; }
      const stats = [
        ['Equity', money(p.equity), ''],
        ['Total P&L', signed(p.totalPnl), pnlClass(p.totalPnl)],
        ['Realized', signed(p.realizedPnl), pnlClass(p.realizedPnl)],
        ['Open P&L', signed(p.unrealizedPnl), pnlClass(p.unrealizedPnl)],
      ].map(([label, value, cls]) =>
        `<div class="stat"><div class="label">${label}</div><div class="value ${cls}">${esc(value)}</div></div>`
      ).join('');

      let positions = '';
      if (p.positions.length) {
        positions = `<div class="section-title">Open positions</div><table>
          <tr><th>Symbol</th><th>Qty</th><th>Avg</th><th>Last</th><th>Open P&L</th></tr>` +
          p.positions.map((pos) => `<tr>
            <td>${esc(pos.symbol)}</td>
            <td>${pos.qty > 0 ? 'long ' : 'short '}${Math.abs(pos.qty).toFixed(4)}</td>
            <td>${pos.avg.toFixed(2)}</td>
            <td>${pos.last.toFixed(2)}</td>
            <td class="${pnlClass(pos.unrealized)}">${signed(pos.unrealized)}</td>
          </tr>`).join('') + `</table>`;
      }

      el.innerHTML =
        `<div class="paper-note">
          <span>📝 <b>Paper trading</b> — simulated fills only, no broker connected.
          Cash ${money(p.cash)} · trades when confidence ≥ ${(p.minConfidence * 100).toFixed(0)}% · ${money(p.tradeNotional)}/trade.</span>
          <button class="btn-reset" onclick="resetPortfolio(this)">Reset portfolio</button>
        </div>
        <div class="stats">${stats}</div>${positions}`;
    }

    async function resetPortfolio(btn) {
      if (!confirm('Reset the paper portfolio back to starting cash? Positions and trade history will be cleared. Signal history is kept.')) return;
      btn.disabled = true;
      btn.textContent = 'Resetting…';
      try {
        await fetch('/api/reset', { method: 'POST' });
        await poll();
      } catch (e) {
        alert('Reset failed: ' + e.message);
        btn.disabled = false;
        btn.textContent = 'Reset portfolio';
      }
    }

    function render(data) {
      renderPortfolio(data.portfolio);
      const status = document.getElementById('status');
      status.innerHTML = data.configured
        ? `Claude <b>${esc(data.model)}</b> · ${data.signals.length} signal(s)`
        : `<b>ANTHROPIC_API_KEY not set</b> — recording only`;

      const feed = document.getElementById('feed');
      if (!data.signals.length) {
        feed.innerHTML = '<div class="empty">No signals yet. Fire a TradingView alert (or run <code>npm run test:signal</code>).</div>';
        return;
      }

      feed.innerHTML = data.signals.map((s) => {
        const a = s.analysis;
        const action = a ? a.action : s.status;
        const sym = s.payload.symbol || s.payload.ticker || 'unknown';
        const when = new Date(s.receivedAt).toLocaleTimeString();

        let body;
        if (s.status === 'analyzing') {
          body = `<div class="reasoning muted"><span class="spinner"></span> Claude is analyzing…</div>`;
        } else if (s.status === 'no_api_key') {
          body = `<div class="reasoning muted">Recorded. Set ANTHROPIC_API_KEY to enable analysis.</div>`;
        } else if (s.status === 'error') {
          body = `<div class="reasoning muted">Analysis error: ${esc(s.error)}</div>`;
        } else if (a) {
          body = `<div class="reasoning">${esc(a.reasoning)}</div>`;
        } else {
          body = '';
        }

        const conf = a
          ? `<span class="conf">confidence ${(a.confidence * 100).toFixed(0)}% · risk ${esc(a.risk_level)}</span>`
          : '';

        const trade = s.trade
          ? `<span class="trade-badge">📝 paper ${esc(s.trade.side)} ${Number(s.trade.qty).toFixed(4)}</span>`
          : '';

        return `<div class="card">
          <div class="card-top">
            <span class="pill ${esc(action)}">${esc(action)}</span>
            <span class="sym">${esc(sym)}</span>
            ${trade}
            ${conf}
            <span class="time">${esc(when)}</span>
          </div>
          ${body}
          <pre>${esc(JSON.stringify(s.payload))}</pre>
        </div>`;
      }).join('');
    }

    async function poll() {
      try {
        const res = await fetch('/api/signals');
        render(await res.json());
      } catch (e) {
        document.getElementById('status').textContent = 'offline — retrying…';
      }
    }
    poll();
    setInterval(poll, 2000);
  </script>
</body>
</html>
